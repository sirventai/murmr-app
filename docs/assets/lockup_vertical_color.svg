<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Logomark centrado arriba -->
  <g transform="translate(120, 10)">
    <svg viewBox="0 0 100 100" width="60" height="60" fill="none">
      <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>
      <path d="M10,50 L26,50 L30,74 L42,26 L50,50 L58,26 L70,74 L74,50 L90,50" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </g>

  <!-- Texto "Murmr" -->
  <text x="150" y="105" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Murmr</text>

  <!-- Tagline -->
  <text x="150" y="125" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="300" fill="#6B7280" letter-spacing="3">SECURE MESSAGING BY SOUND</text>
</svg>